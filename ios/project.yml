name: SpineCare
options:
  bundleIdPrefix: com.spinecare
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  SpineCare:
    type: application
    platform: iOS
    sources:
      - SpineCare
      # Exercise plan shared with the server and the Android app.
      - path: ../shared/exercises.json
        buildPhase: resources
    info:
      path: SpineCare/Info.plist
      properties:
        CFBundleDisplayName: SpineCare
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ro]
        NSCameraUsageDescription: "SpineCare uses the camera to guide and monitor your rehabilitation exercises. Video never leaves the device; in server mode only body landmarks are sent unless you choose frame streaming."
        NSBluetoothAlwaysUsageDescription: "SpineCare connects to optional SpineCare posture sensors (ESP32 head/trunk nodes) over Bluetooth."
        NSMotionUsageDescription: "Used for posture context during exercises."
        UIBackgroundModes: []
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spinecare.app
        INFOPLIST_FILE: SpineCare/Info.plist
