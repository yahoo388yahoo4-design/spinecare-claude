[env:esp32c3_posture]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; BLE comes with the arduino-esp32 core; a separate BLE library conflicts with it.
    sparkfun/SparkFun BMI270 Arduino Library@^1.0.3
