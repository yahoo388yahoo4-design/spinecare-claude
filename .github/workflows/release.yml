name: Release builds

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Set the SPINECARE_KEYSTORE_B64 / _PASSWORD / _ALIAS / _KEY_PASSWORD secrets to sign
      # with a private release key; otherwise the release APK uses the committed debug key
      # (android/keystore), so it installs over CI debug builds instead of conflicting.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Assemble release APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.SPINECARE_KEYSTORE_B64 }}
          SPINECARE_KEYSTORE_PASSWORD: ${{ secrets.SPINECARE_KEYSTORE_PASSWORD }}
          SPINECARE_KEY_ALIAS: ${{ secrets.SPINECARE_KEY_ALIAS }}
          SPINECARE_KEY_PASSWORD: ${{ secrets.SPINECARE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/spinecare-release.keystore"
            export SPINECARE_KEYSTORE="$RUNNER_TEMP/spinecare-release.keystore"
          fi
          gradle --no-daemon assembleRelease
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the APKs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "spinecare-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "spinecare-${GITHUB_REF_NAME}-debug.apk"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spinecare-*.apk

  ios-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned, for CI artifact)
        working-directory: ios
        run: |
          xcodebuild -project SpineCare.xcodeproj -scheme SpineCare \
            -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SpineCare.app Payload/
          zip -qr SpineCare-unsigned.ipa Payload
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ios/SpineCare-unsigned.ipa
