name: Release builds

on:
  push:
    tags: ["v*"]
  # Run from the Actions tab (or the API) with a version like v0.3.0: builds the
  # commit it runs on, creates that tag and release, and attaches the APKs and IPA.
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.3.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Set the SPINECARE_KEYSTORE_B64 / _PASSWORD / _ALIAS / _KEY_PASSWORD secrets to sign
      # with a private release key; otherwise the release APK uses the committed debug key
      # (android/keystore), so it installs over CI debug builds instead of conflicting.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Assemble release APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.SPINECARE_KEYSTORE_B64 }}
          SPINECARE_KEYSTORE_PASSWORD: ${{ secrets.SPINECARE_KEYSTORE_PASSWORD }}
          SPINECARE_KEY_ALIAS: ${{ secrets.SPINECARE_KEY_ALIAS }}
          SPINECARE_KEY_PASSWORD: ${{ secrets.SPINECARE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/spinecare-release.keystore"
            export SPINECARE_KEYSTORE="$RUNNER_TEMP/spinecare-release.keystore"
          fi
          gradle --no-daemon assembleRelease
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the APKs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "spinecare-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "spinecare-${TAG}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: spinecare-*.apk

  ios-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned, for CI artifact)
        working-directory: ios
        run: |
          xcodebuild -project SpineCare.xcodeproj -scheme SpineCare \
            -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SpineCare.app Payload/
          zip -qr SpineCare-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ios/SpineCare-unsigned.ipa

  publish:
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "SpineCare $TAG" \
              --notes "Android: spinecare-$TAG.apk (package com.spinecare.claude, installs over CI debug builds). iOS: SpineCare-unsigned.ipa (unsigned; sideload with your own signing). Prototype: not for unsupervised rehabilitation."
          fi
