name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-files:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Regenerate iOS strings and metric test vectors
        run: |
          python scripts/gen_ios_strings.py
          python scripts/gen_metric_vectors.py
      - name: Fail if anything changed (run the scripts above and commit)
        run: git diff --exit-code

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r server/requirements-dev.txt
      - name: Pose, rep, tracker and API tests
        working-directory: server
        run: python -m pytest -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk spinecare-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spinecare-debug-apk
          path: spinecare-debug.apk
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/
      # Every push to main refreshes a pre-release with the newest APK, so there is
      # always a direct download link: Releases -> "Latest Android build".
      - name: Publish rolling pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest spinecare-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest Android build" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. Prototype: not for unsupervised rehabilitation. Uninstall older builds first if Android refuses to update (each CI runner signs with its own debug key)."

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project SpineCare.xcodeproj -scheme SpineCare \
            -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SpineCare.app Payload/
          zip -qr SpineCare-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: spinecare-ios-unsigned-ipa
          path: ios/SpineCare-unsigned.ipa

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - name: Build ESP32-C3 posture node
        working-directory: firmware/esp32_posture_node
        run: pio run
